[package]
name = "change-harness"
version = "0.1.4"
edition = "2024"
rust-version = "1.95"
publish = false
description = "A local, project-neutral change-control harness for humans and coding agents"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml_ng = "0.10.0"
sha2 = "0.10"
# Backup verification restores a bundle into a scratch directory to read every
# object, so this is a runtime need rather than a test-only one.
tempfile = "3.23"
thiserror = "2.0"
time = { version = "0.3", features = ["formatting", "parsing", "serde"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }

